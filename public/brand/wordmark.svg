<?xml version="1.0" encoding="UTF-8"?>
<!--
  Donadão Labs · Wordmark v1.1
  Bolder weight (800) · tighter tracking · Inter Tight web-loaded
  IMPORTANT: Embed Google Fonts CSS so the wordmark renders correctly
  even when opened standalone (browser/PDF viewers that support CSS in SVG).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 480 96"
     role="img"
     aria-label="Donadão Labs">
  <title>Donadão Labs</title>
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&amp;display=swap');
      .donadao-text {
        font-family: 'Inter Tight', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 72px;
        letter-spacing: -3px;
      }
      .labs-text {
        font-family: 'Inter Tight', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        font-size: 72px;
        letter-spacing: -2px;
      }
    </style>
  </defs>
  <text x="0" y="72" class="donadao-text" fill="currentColor">Donadão</text>
  <text x="320" y="72" class="labs-text" fill="currentColor">Labs</text>
</svg>
