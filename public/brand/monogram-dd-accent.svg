<?xml version="1.0" encoding="UTF-8"?>
<!--
  Donadão Labs · Monogram DD — Light variant on white
  Inverse of dark version. Use on light backgrounds.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     role="img"
     aria-label="Donadão Labs">
  <title>Donadão Labs · DD</title>

  <defs>
    <linearGradient id="ddPurpleL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7BFF"/>
      <stop offset="50%" stop-color="#6E5BFF"/>
      <stop offset="100%" stop-color="#4B3DD9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square tile background -->
  <rect width="256" height="256" rx="56" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="2"/>

  <!-- D1 — solid purple gradient -->
  <path fill="url(#ddPurpleL)" fill-rule="evenodd" clip-rule="evenodd"
        d="M48 64
           L48 192
           L96 192
           C 132 192, 160 164, 160 128
           C 160 92, 132 64, 96 64
           Z
           M76 92
           L96 92
           C 116 92, 132 108, 132 128
           C 132 148, 116 164, 96 164
           L76 164
           Z"/>

  <!-- D2 — outlined ink -->
  <path fill="none" stroke="#050505" stroke-width="10" stroke-linejoin="round"
        d="M120 64
           L120 192
           L168 192
           C 204 192, 232 164, 232 128
           C 232 92, 204 64, 168 64
           Z"/>
  <path fill="none" stroke="#050505" stroke-width="6" stroke-linejoin="round"
        d="M148 92
           L168 92
           C 188 92, 204 108, 204 128
           C 204 148, 188 164, 168 164
           L148 164
           Z"/>

  <!-- Accent dot -->
  <circle cx="216" cy="216" r="10" fill="#6E5BFF"/>
  <circle cx="216" cy="216" r="6" fill="#FAFAFA"/>
</svg>
